name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prerequisites: Enable GitHub Pages in repo Settings → Pages → Source: "GitHub Actions"
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare build directory
        run: mkdir -p .pages-output

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./.pages-output

      - name: Generate resource browser
        run: python3 .github/scripts/generate_resource_browser.py .pages-output

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.pages-output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
