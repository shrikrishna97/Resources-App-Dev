<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<div id="my_app">
    <h1>{{ message }}</h1>
    <!-- <counter name="mad-2" ></counter> -->
    <!-- <counter :message="message"></counter> -->
    <counter @child-clicked="manage" name="mad-2" :message="message">
        <template v-slot:header >hello counter header</template> 
        <template >hi there footer</template>
    </counter>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

<script type="module">
    import { counter } from './counter.js';
    Vue.component('counter', counter);

    new Vue({
        el: '#my_app',
        data: {
            message: 'Chennai'
        },
        methods: {
            manage(data) {
                this.message = data;
                console.log(data);
            }
        }
    })
</script>

</body>
</html>
