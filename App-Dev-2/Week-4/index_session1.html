<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


<div id="my_app">
    <h1>{{ message }}</h1>
    <!-- <counter name="mad-2" ></counter> -->
    <!-- <counter :message="message"></counter> -->
    <counter @child-clicked="manage" name="mad-2" :message="message"></counter>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

<script>
    Vue.component('counter',{
        props: ['name','message'],
        template: `<h1>count something in the app {{name}}<h3>hello {{message}}</h3>
            <button @click="notifyParent">Notify Parent</button></h1>`,
        methods: {
            notifyParent(){
                this.$emit('child-clicked', 'Hello from Child!');
            }
        }
    })

    new Vue({
        el: '#my_app',
        data: {
            message: 'Chennai'
        },
        methods: {
            manage(data) {
                this.message = data;
                console.log(data);
            }
        }
    })
</script>

</body>
</html>
